name: Verificación Gasto360 R8.9 — móvil y OCR
on:
  pull_request:
    paths:
      - "pruebas-r89/**"
      - ".github/workflows/test-ocr-r89.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Revisar sintaxis de los módulos
        run: |
          node --check pruebas-r89/scanner.js
          node --check pruebas-r89/scanner-r86-core.js
          node --check pruebas-r89/ocr-r87.js
          node --check pruebas-r89/test-app.js
      - name: Verificar módulos integrados y recuperación del OCR
        run: node pruebas-r89/tests-r89.cjs
